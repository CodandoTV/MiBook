name: mibook
description: "Project that works as a Reading Manager for avid readers"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.8
  flutter_lints: ^6.0.0
  get_it: ^9.2.1
  injectable: ^2.7.1+4
  json_serializable: ^6.13.1
  json_annotation: ^4.11.0
  auto_route: ^11.1.0
  cached_network_image: 3.4.1
  dio: ^5.9.2
  freezed: ^3.2.5
  freezed_annotation: ^3.1.0
  encrypted_shared_preferences: 3.0.1
  flutter_bloc: ^9.1.1
  mockito: ^5.6.3
  shimmer: 3.0.0
  flutter_html: 3.0.0
  shared_preferences: ^2.5.4
  auto_size_text: 3.0.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  injectable_generator: ^2.6.2
  auto_route_generator: ^10.5.0
  bloc_test: ^10.0.0
  test: ^1.25.2
  flutter_launcher_icons: ^0.13.1

targets:
  $default:
    builders:
      json_serializable:
        options:
          field_rename: snake

flutter:
  uses-material-design: true
  assets:
    - images/empty-list.png

flutter_launcher_icons:
  ios: true
  image_path: "images/icons/mibook_icon.png"
  remove_alpha_ios: true
